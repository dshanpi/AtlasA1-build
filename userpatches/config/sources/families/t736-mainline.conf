# Independent board family. Do not include sun60iw2 vendor families.
ARCH="arm64"
BOOTBRANCH="tag:v2026.10"
BOOTSOURCE="https://github.com/u-boot/u-boot.git"
BOOTPATCHDIR="u-boot-t736-mainline"
UBOOT_TARGET_MAP=";;u-boot.bin"
ATF_COMPILE="no"
KERNELSOURCE="https://github.com/gregkh/linux.git"
KERNELBRANCH="tag:v6.18.63"
KERNEL_MAJOR_MINOR="6.18"
KERNELPATCHDIR="t736-mainline-6.18"
LINUXCONFIG="linux-t736-mainline-current"
KERNEL_IMAGE_TYPE="Image"
KERNEL_EXTRA_DRIVERS="no"
SERIALCON="ttyS0"

function prepare_image_size__t736_require_source_layout() {
    if [[ ${USE_HOOK_FOR_PARTITION:-no} != yes || ${FIXED_IMAGE_SIZE:-0} != 8192 ]]; then
        exit_with_error "T736 requires the source packer's 8 GiB GPT and root partition 4; the generic Armbian partitioner cannot create this image"
        return 1
    fi
}

write_uboot_platform() {
    local bundle="${USERPATCHES_PATH:-}/t736-private"
    if [[ -z ${SDCARD:-} || -z ${USERPATCHES_PATH:-} || ! -f "${bundle}/tools/write_t736_image_boot.py" ]]; then
        printf '%s\n' "T736 boot installation requires the build image, fixed eGON SPL, and stage64/TF-A/U-Boot source package" >&2
        return 1
    fi
    python3 "${bundle}/tools/write_t736_image_boot.py" "${SDCARD}.raw" \
        "${bundle}/vendor/boot/t736-ddr-spl.bin" "${bundle}/vendor/boot/t736-source-package.bin" \
        "${1}/u-boot.bin" --loop "${2}"
}

setup_write_uboot_platform() {
	# Let Armbian resolve the target block device from its normal root/uboot
	# partition logic.  The framework still performs its own destructive-device
	# checks before calling write_uboot_platform().
	:
}
