# Independent board family. Do not include sun60iw2 vendor families.
ARCH="arm64"
BOOTBRANCH="tag:v2026.10"
BOOTSOURCE="https://github.com/u-boot/u-boot.git"
BOOTPATCHDIR="u-boot-t736-mainline"
UBOOT_TARGET_MAP=";;u-boot.bin"
ATF_COMPILE="no"
KERNELSOURCE="https://github.com/gregkh/linux.git"
KERNELBRANCH="tag:v6.18.63"
KERNEL_MAJOR_MINOR="6.18"
KERNELPATCHDIR="t736-mainline-6.18"
LINUXCONFIG="linux-t736-mainline-current"
KERNEL_IMAGE_TYPE="Image"
KERNEL_EXTRA_DRIVERS="no"
SERIALCON="ttyS0"

# The independent T736 U-Boot patch produces a conventional u-boot.bin.  Keep
# the raw placement identical to the tested boot layout: 8 KiB offset, 1 KiB
# alignment.  This is deliberately small and auditable; it does not invoke
# Tina packers or silently substitute a vendor loader.
write_uboot_platform() {
	local uboot_dir="$1"
	local device="$2"
	local image="${uboot_dir}/u-boot.bin"
	[[ -f "${image}" ]] || exit_with_error "T736: missing ${image}"
	# The licensed fixed LPDDR4x training stage is supplied out-of-tree. When
	# the integration entrypoint provides it, place it at the board's raw boot
	# offset before the independently built U-Boot. Without this input the
	# build is intentionally rejected by the entrypoint as incomplete.
	local ddr_spl="${T736_VENDOR_ROOT:-}/boot/t736-ddr-spl.bin"
	if [[ -f "${ddr_spl}" ]]; then
		dd if="${ddr_spl}" of="${device}" conv=fsync bs=512 seek=0 status=none
	fi
	dd if="${image}" of="${device}" conv=fsync bs=1024 seek=8 status=none
}

setup_write_uboot_platform() {
	# Let Armbian resolve the target block device from its normal root/uboot
	# partition logic.  The framework still performs its own destructive-device
	# checks before calling write_uboot_platform().
	:
}
