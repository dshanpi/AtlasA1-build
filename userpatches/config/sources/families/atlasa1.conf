# SPDX-License-Identifier: GPL-2.0-only
ARCH="arm64"
KERNEL_MAJOR_MINOR="6.18"
KERNELBRANCH="branch:atlasa1-v47"
BOOTBRANCH="branch:atlasa1-v47"
KERNELPATCHDIR="atlasa1-6.18"
BOOTPATCHDIR="u-boot-atlasa1"
LINUXCONFIG="linux-atlasa1-current"
KERNEL_IMAGE_TYPE="Image"
KERNEL_EXTRA_DRIVERS="no"
EXTRAWIFI="no"
ATF_COMPILE="no"
UBOOT_TARGET_MAP=";;u-boot.bin atlasa1-spl.bin atlasa1-package.bin atlasa1-boot.json atlasa1-image.py"
SERIALCON="ttyS0"
BOOTSIZE=0
IMAGE_PARTITION_TABLE="gpt"
ROOTFS_TYPE="ext4"
INCLUDE_HOME_DIR="yes"
KERNEL_GIT="shallow"
SKIP_EXTERNAL_TOOLCHAINS="yes"

function write_uboot_platform() {
    case "$2" in /dev/loop[0-9]*) ;; *) echo 'Use FES to write AtlasA1 eMMC images.' >&2; return 1 ;; esac
    python3 "$1/atlasa1-image.py" boot --device "$2" --bundle "$1"
}

function setup_write_uboot_platform() { :; }
