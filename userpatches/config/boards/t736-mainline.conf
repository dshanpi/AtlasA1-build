# T736 Aurora/Atlas open SBC board definition for Armbian.
# This file is also emitted by tools/export_t736_armbian_patch.py.
BOARD_NAME="T736 Aurora/Atlas"
BOARD_VENDOR="T736 open SBC"
BOARDFAMILY="t736-mainline"
KERNEL_TARGET="current"
BOOTCONFIG="t736_bringup_defconfig"
SERIALCON="ttyS0"
BOOT_FDT_FILE="allwinner/t736-mainline-bringup.dtb"
HAS_VIDEO_OUTPUT="yes"

function post_family_tweaks__t736_display_idle() {
    [[ "${BUILD_DESKTOP:-no}" == yes ]] || return 0
    local files="${USERPATCHES_PATH}/config/t736-display"
    install -D -m 0644 "${files}/30-t736-x11-blank.conf" "${SDCARD}/etc/X11/xorg.conf.d/30-t736-x11-blank.conf"
    if [[ -d "${SDCARD}/usr/share/gdm/dconf" ]]; then
        install -m 0644 "${files}/95-t736-greeter" "${SDCARD}/usr/share/gdm/dconf/95-t736-greeter"
    fi
}
